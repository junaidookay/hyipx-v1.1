services:
  db:
    image: mysql:8.0
    container_name: hyipx_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hyipx_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-hyipx}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hyipx_pass}
    ports:
      - "3306:3306"
    volumes:
      - hyipx_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyipx_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-hyipx}
      DB_PASSWORD: ${DB_PASSWORD:-hyipx_pass}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LICENSE_KEY: ${LICENSE_KEY:-}
      APP_KEY: ${APP_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  hyipx_dbdata:
